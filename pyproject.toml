[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minihelper"
version = "0.2.0"
description = "A simple yet useful CLI-based assistant that provides results via a short command."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Joseph", email = "joseph.octahedron@gmail.com" }
]
dependencies = ["httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[project.scripts]
minihelper = "main:main"
mh = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "data*"]